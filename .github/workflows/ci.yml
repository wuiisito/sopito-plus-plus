name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests & Examples (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Unit Tests
      run: |
        python tests/test_sopito.py

    - name: Test Examples Execution with Sopito VM
      run: |
        python sopitoc.py run examples/01_hola_mundo.spp
        python sopitoc.py run examples/02_suma.spp
        python sopitoc.py run examples/03_contador.spp
        python sopitoc.py run examples/04_fibonacci.spp
        python sopitoc.py run examples/05_factoral.spp

    - name: Test C++ Compilation
      run: |
        python sopitoc.py compile examples/01_hola_mundo.spp -o test_01.cpp
        python sopitoc.py compile examples/02_suma.spp -o test_02.cpp
        python sopitoc.py compile examples/03_contador.spp -o test_03.cpp

  docs:
    name: Build Read the Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build HTML Documentation
      run: |
        python -m sphinx -W -b html docs docs/_build/html
